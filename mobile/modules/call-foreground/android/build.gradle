apply plugin: 'com.android.library'

group = 'expo.modules.callforeground'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()

/*
 * Tre cose imparate da due build fallite, e tutte e tre invisibili leggendo
 * il codice:
 *
 * - `useExpoPublishing()` **non va** in un modulo locale: cerca il componente
 *   software `release`, che esiste solo nei moduli pubblicati su npm, e la
 *   configurazione del progetto muore prima di compilare.
 * - `compileSdk` va dichiarato: qui il progetto radice non lo propaga, e
 *   Gradle si ferma con «compileSdkVersion is not specified».
 * - `lintOptions` non esiste piu': AGP 8 lo ha rimosso, si chiama `lint`.
 */
def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "expo.modules.callforeground"
  compileSdk safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 24)
    targetSdk safeExtGet("targetSdkVersion", 35)
    versionCode 1
    versionName "0.1.0"
  }

  lint {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
}
